<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Access — OMNEXA AI</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #060b1a;
      --surface: rgba(255,255,255,0.04);
      --border: rgba(255,255,255,0.08);
      --accent: #6c63ff;
      --accent-2: #00d4ff;
      --text: #e8eaf0;
      --muted: #6b7280;
      --error: #ff4d6d;
      --radius: 20px;
    }

    html, body {
      height: 100%;
      font-family: 'Inter', sans-serif;
      background: var(--bg);
      color: var(--text);
      overflow: hidden;
    }

    /* Animated background */
    .bg-canvas {
      position: fixed; inset: 0; z-index: 0;
      background:
        radial-gradient(ellipse 80% 60% at 20% 10%, rgba(108,99,255,.22) 0%, transparent 60%),
        radial-gradient(ellipse 60% 50% at 80% 90%, rgba(0,212,255,.16) 0%, transparent 55%),
        radial-gradient(ellipse 50% 40% at 60% 40%, rgba(255,77,109,.10) 0%, transparent 50%);
    }

    /* Floating orbs */
    .orb {
      position: fixed; border-radius: 50%; filter: blur(80px); z-index: 0;
      animation: drift 12s ease-in-out infinite alternate;
    }
    .orb-1 { width: 500px; height: 500px; top: -120px; left: -120px; background: rgba(108,99,255,.18); }
    .orb-2 { width: 400px; height: 400px; bottom: -100px; right: -80px;  background: rgba(0,212,255,.14); animation-delay: -6s; }
    .orb-3 { width: 300px; height: 300px; top: 50%; left: 50%; transform: translate(-50%,-50%); background: rgba(255,77,109,.10); animation-delay: -3s; }

    @keyframes drift {
      from { transform: translate(0, 0) scale(1); }
      to   { transform: translate(30px, 20px) scale(1.06); }
    }

    /* Grid dots */
    .grid-overlay {
      position: fixed; inset: 0; z-index: 0;
      background-image:
        radial-gradient(rgba(255,255,255,.04) 1px, transparent 1px);
      background-size: 32px 32px;
      mask-image: radial-gradient(ellipse 80% 80% at 50% 50%, black 40%, transparent 100%);
    }

    /* Layout */
    .page {
      position: relative; z-index: 1;
      min-height: 100vh;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      padding: 24px;
      gap: 32px;
    }

    /* Logo badge */
    .logo-wrap {
      display: flex; align-items: center; gap: 10px;
      animation: fadeUp .6s ease both;
    }
    .logo-icon {
      width: 44px; height: 44px; border-radius: 12px;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      display: flex; align-items: center; justify-content: center;
      font-size: 20px; font-weight: 800; color: #fff;
      box-shadow: 0 0 24px rgba(108,99,255,.5);
    }
    .logo-text { font-size: 22px; font-weight: 700; letter-spacing: -.5px; }
    .logo-text span { color: var(--accent-2); }

    /* Card */
    .card {
      width: 100%; max-width: 440px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 40px 36px;
      backdrop-filter: blur(24px) saturate(180%);
      box-shadow:
        0 0 0 1px rgba(255,255,255,.05),
        0 40px 80px rgba(0,0,0,.6),
        inset 0 1px 0 rgba(255,255,255,.07);
      animation: fadeUp .7s ease .1s both;
    }

    .card-header { text-align: center; margin-bottom: 32px; }
    .lock-icon {
      width: 56px; height: 56px; border-radius: 16px; margin: 0 auto 16px;
      background: linear-gradient(135deg, rgba(108,99,255,.3), rgba(0,212,255,.2));
      border: 1px solid rgba(108,99,255,.35);
      display: flex; align-items: center; justify-content: center;
      font-size: 26px;
      box-shadow: 0 0 32px rgba(108,99,255,.25);
      animation: pulse-glow 3s ease-in-out infinite;
    }
    @keyframes pulse-glow {
      0%, 100% { box-shadow: 0 0 20px rgba(108,99,255,.25); }
      50%       { box-shadow: 0 0 40px rgba(108,99,255,.5); }
    }

    .card h1 {
      font-size: 24px; font-weight: 700; letter-spacing: -.5px;
      margin-bottom: 8px;
    }
    .card p {
      font-size: 14px; color: var(--muted); line-height: 1.6;
    }

    /* Form */
    .field { position: relative; margin-bottom: 20px; }

    .field label {
      display: block; font-size: 13px; font-weight: 500;
      color: #9ca3af; margin-bottom: 8px; letter-spacing: .3px;
    }

    .field input {
      width: 100%;
      padding: 14px 48px 14px 16px;
      background: rgba(255,255,255,.05);
      border: 1px solid rgba(255,255,255,.1);
      border-radius: 12px;
      color: var(--text);
      font-family: 'Inter', sans-serif;
      font-size: 15px;
      outline: none;
      transition: border-color .2s, box-shadow .2s, background .2s;
      letter-spacing: 1px;
    }
    .field input:focus {
      border-color: var(--accent);
      background: rgba(108,99,255,.08);
      box-shadow: 0 0 0 3px rgba(108,99,255,.18);
    }
    .field input::placeholder { color: rgba(255,255,255,.2); letter-spacing: 0; }

    /* Toggle visibility */
    .toggle-vis {
      position: absolute; right: 14px; top: 38px;
      background: none; border: none; cursor: pointer;
      color: var(--muted); font-size: 18px;
      padding: 4px; transition: color .2s;
    }
    .toggle-vis:hover { color: var(--text); }

    /* Error */
    .error-msg {
      display: flex; align-items: center; gap: 8px;
      background: rgba(255,77,109,.12);
      border: 1px solid rgba(255,77,109,.3);
      border-radius: 10px; padding: 12px 14px;
      font-size: 13px; color: #ff7090;
      margin-bottom: 20px;
      animation: shakeX .4s ease;
    }
    @keyframes shakeX {
      0%,100% { transform: translateX(0); }
      20%      { transform: translateX(-6px); }
      40%      { transform: translateX(6px); }
      60%      { transform: translateX(-4px); }
      80%      { transform: translateX(4px); }
    }

    /* Submit button */
    .btn {
      width: 100%;
      padding: 15px;
      border: none; border-radius: 12px;
      background: linear-gradient(135deg, var(--accent), #8b5cf6);
      color: #fff; font-family: 'Inter', sans-serif;
      font-size: 15px; font-weight: 600;
      cursor: pointer; letter-spacing: .3px;
      transition: opacity .2s, transform .15s, box-shadow .2s;
      box-shadow: 0 4px 24px rgba(108,99,255,.4);
      position: relative; overflow: hidden;
    }
    .btn::after {
      content: '';
      position: absolute; inset: 0;
      background: linear-gradient(90deg, transparent 0%, rgba(255,255,255,.1) 50%, transparent 100%);
      transform: translateX(-100%);
      transition: transform .6s;
    }
    .btn:hover::after { transform: translateX(100%); }
    .btn:hover { opacity: .9; box-shadow: 0 6px 30px rgba(108,99,255,.55); transform: translateY(-1px); }
    .btn:active { transform: translateY(0); opacity: .95; }

    /* Footer */
    .footer {
      font-size: 12px; color: var(--muted);
      animation: fadeUp .8s ease .2s both;
    }
    .footer a { color: #6c63ff; text-decoration: none; }
    .footer a:hover { text-decoration: underline; }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(18px); }
      to   { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>
  <div class="bg-canvas"></div>
  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>
  <div class="orb orb-3"></div>
  <div class="grid-overlay"></div>

  <div class="page">
    <!-- Logo -->
    <div class="logo-wrap">
      <div class="logo-icon">O</div>
      <div class="logo-text">OMNEXA<span> AI</span></div>
    </div>

    <!-- Card -->
    <div class="card">
      <div class="card-header">
        <div class="lock-icon">🔒</div>
        <h1>Protected Access</h1>
        <p>This site is password protected.<br>Enter the access password to continue.</p>
      </div>

      {% if error %}
      <div class="error-msg" id="error-msg">
        <span>⚠</span> {{ error }}
      </div>
      {% endif %}

      <form method="post" action="/enter-password/">
        {% csrf_token %}
        <input type="hidden" name="next" value="{{ next }}" />

        <div class="field">
          <label for="password-input">Access Password</label>
          <input
            type="password"
            id="password-input"
            name="password"
            placeholder="Enter password"
            autocomplete="current-password"
            autofocus
            required
          />
          <button type="button" class="toggle-vis" onclick="toggleVis()" title="Toggle visibility" id="vis-toggle">👁</button>
        </div>

        <button type="submit" class="btn" id="submit-btn">
          Unlock Access →
        </button>
      </form>
    </div>

    <div class="footer">
      &copy; {{ year }} OMNEXA AI — All rights reserved.
    </div>
  </div>

  <script>
    function toggleVis() {
      const inp = document.getElementById('password-input');
      const btn = document.getElementById('vis-toggle');
      if (inp.type === 'password') {
        inp.type = 'text';
        btn.textContent = '🙈';
      } else {
        inp.type = 'password';
        btn.textContent = '👁';
      }
    }

    // Add loading state on submit
    document.querySelector('form').addEventListener('submit', function() {
      const btn = document.getElementById('submit-btn');
      btn.textContent = 'Verifying…';
      btn.style.opacity = '0.7';
      btn.disabled = true;
    });

    // Inject current year
    document.querySelector('.footer').innerHTML =
      '&copy; ' + new Date().getFullYear() + ' OMNEXA AI — All rights reserved.';
  </script>
</body>
</html>
